[project]
name = "multi-agent-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Omkar Mishra", email = "omkarmishra2407@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-groq>=1.1.3",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "streamlit>=1.43.0",
    "tavily-python>=0.3.0",
]

[project.scripts]
multi-agent-system = "multi_agent_system:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
